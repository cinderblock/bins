name: Build image

# Push to master → build the image and push it to GHCR. That is the whole job:
# this repo publishes a *candidate*, it does not deploy.
#
# Which image each deployment runs is pinned in the ops repo (cinderblock/ops):
#   firefly   (https://i.mathcamp.us)  servers/firefly/stacks/bins/pin.json
#   steamboat (LAN warehouse instance) servers/steamboat/stacks/bins-tsl/pin.json
#
# Shipping a build is two steps: push here, then edit the pin(s) you want moved
# and push ops. The two deployments can sit on different builds; that is a
# feature, not drift.
#
# This repo has no self-hosted runner and no access to any host. It used to run
# its build, its release staging and its restart INSIDE the production container
# on each host — so `bun install` here executed third-party postinstall scripts
# next to live SQLite data. See ops plans/ops-owned-app-deploys.md.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }} # cinderblock/bins

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:latest
          # ops verifies this label against the commit its pin claims, so a
          # hand-edited pin.json can't quietly ship a different build than the
          # one that was reviewed. Required — the deploy fails without it.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize how to deploy this build
        run: |
          {
            echo "### Image published"
            echo
            echo '```json'
            echo '{'
            echo '  "image": "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}",'
            echo '  "digest": "${{ steps.push.outputs.digest }}",'
            echo '  "source": {'
            echo '    "repo": "${{ github.repository }}",'
            echo '    "commit": "${{ github.sha }}"'
            echo '  }'
            echo '}'
            echo '```'
            echo
            echo "Paste into the pin.json of whichever deployment(s) you want moved,"
            echo "in cinderblock/ops, and push:"
            echo
            echo '- `servers/firefly/stacks/bins/pin.json` — https://i.mathcamp.us'
            echo '- `servers/steamboat/stacks/bins-tsl/pin.json` — store.tomsawyerlabs.com'
            echo
            echo "Nothing reaches either host until you do."
          } >> "$GITHUB_STEP_SUMMARY"
