# Reference deploy: a self-hosted runner on the target host builds the app and
# flips an atomic release symlink. Register your runner with the `bins` label
# (or edit the matrix), and adapt APP_ROOT/SOCKET to your host layout.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  APP_ROOT: /srv/bins
  SOCKET: /run/bins/bins.sock

jobs:
  deploy:
    strategy:
      # One instance's host being down must never cancel another's deploy.
      fail-fast: false
      matrix:
        # One entry per deployment of this app. Each instance runs its own
        # self-hosted runner (label = the value here), and each runner lives
        # on its own host with its own volumes — so APP_ROOT and SOCKET are
        # identical everywhere and only the label varies. To add a
        # deployment: register a runner with a new label, add it here.
        #   bins     — firefly,  https://i.mathcamp.us
        #   bins-tsl — steamboat, LAN-only warehouse instance
        instance: [bins, bins-tsl]
    runs-on: [self-hosted, "${{ matrix.instance }}"]
    # Per instance, not global: two pushes to the SAME deployment must
    # serialize (they race on one host's release tree), but two different
    # deployments have no reason to wait on each other.
    concurrency:
      group: deploy-${{ matrix.instance }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Build (Bun)
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      - name: Stage release tree
        run: |
          set -euo pipefail
          REL="$APP_ROOT/releases/$GITHUB_SHA"
          rm -rf "$REL"
          mkdir -p "$REL"
          # Ready-to-run tree: the SPA build, the server entry and everything it
          # imports at runtime (api/, shared/, db/ incl. migrations — the app
          # auto-migrates on boot), and prod node_modules.
          #
          # This list is hand-maintained: a module server.ts imports that is
          # missing here builds fine, stages fine, and then the release cannot
          # boot at all. Add new runtime files as you add them.
          cp -r build api shared db server.ts release-assets.ts run package.json bun.lock "$REL"/
          chmod +x "$REL/run"
          # Stamp the build SHA so the running app reports which release it is
          # (server.ts serves it at /_version; the health check below verifies it).
          printf '%s' "$GITHUB_SHA" > "$REL/BUILD_SHA"
          # Prune to production dependencies inside the release dir.
          ( cd "$REL" && bun install --frozen-lockfile --production )

      - name: Smoke-test the staged release before activating it
        # The symlink flip is what takes the site down, and it happens BEFORE
        # the health check below — so a release that cannot start at all takes
        # production with it and CI only finds out afterwards. That is exactly
        # what happened: a module server.ts imports was missing from the file
        # list above, which builds and stages perfectly and then dies on every
        # start. Boot it here, while the live site is still untouched.
        #
        # Isolated: its own socket and a THROWAWAY database, so this can
        # neither collide with the running instance nor migrate real data.
        run: |
          set -euo pipefail
          REL="$APP_ROOT/releases/$GITHUB_SHA"
          SOCK="$REL/preflight.sock"
          (
            cd "$REL"
            SOCKET_PATH="$SOCK" DATABASE_PATH="$REL/preflight.db" \
              bun server.ts > "$REL/preflight.log" 2>&1 &
            echo $! > "$REL/preflight.pid"
          )
          ok=""
          for _ in $(seq 1 30); do
            if [ -S "$SOCK" ] && bun -e '
              const r = await fetch("http://localhost/_version", { unix: process.env.SOCK });
              process.exit(r.status === 200 ? 0 : 1);
            ' 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          kill "$(cat "$REL/preflight.pid")" 2>/dev/null || true
          rm -f "$SOCK" "$REL/preflight.pid" "$REL/preflight.db"*
          if [ -z "$ok" ]; then
            echo "::error::staged release failed to start — NOT activating it"
            echo "--- preflight log ---"
            cat "$REL/preflight.log" || true
            exit 1
          fi
          rm -f "$REL/preflight.log"
          echo "staged release starts cleanly"
        env:
          SOCK: /srv/bins/releases/${{ github.sha }}/preflight.sock

      - name: Activate + restart
        run: |
          set -euo pipefail
          # Atomic flip, then poke the supervisor's restart sentinel.
          ln -sfn "releases/$GITHUB_SHA" "$APP_ROOT/current"
          touch "$APP_ROOT/restart"

      - name: Wait for the NEW build to be serving
        # Poll /_version until it reports THIS commit's SHA — proving the
        # supervisor actually restarted into the new release (a plain 200 could
        # be the old process).
        env:
          EXPECT_SHA: ${{ github.sha }}
        run: |
          bun -e '
            const sock = process.env.SOCKET;
            const want = (process.env.EXPECT_SHA ?? "").trim();
            for (let i = 1; i <= 90; i++) {
              try {
                const r = await fetch("http://localhost/_version", { unix: sock });
                const got = (await r.text()).trim();
                if (r.status === 200 && got === want) {
                  console.log(`healthy: /_version -> ${got}`);
                  process.exit(0);
                }
                console.log(`/_version -> ${r.status} "${got.slice(0, 12)}" (want ${want.slice(0, 12)}, retry ${i})`);
              } catch (e) {
                console.log(`socket not ready (retry ${i}): ${e?.code ?? e?.message ?? e}`);
              }
              await new Promise((res) => setTimeout(res, 1000));
            }
            console.error(`::error::new build ${want} never came up on ${sock} within 90s — check the supervisor restart sentinel.`);
            process.exit(1);
          '

      - name: Prune old releases (5 runnable, 30 servable)
        if: always()
        # Deleting an old release deletes the chunks of every device still
        # running it, and those devices then can't boot to update themselves —
        # they need a human to visit /api/recover. The client build is a few MB
        # (the rest of a release is node_modules), so older releases are
        # stripped to just that instead of removed: a stale device keeps
        # booting, and therefore keeps auto-updating, for ~30 deploys instead
        # of 5.
        run: |
          cd "$APP_ROOT/releases" 2>/dev/null || exit 0
          current="$(readlink -f "$APP_ROOT/current" 2>/dev/null || echo none)"
          n=0
          for d in $(ls -1dt -- */ 2>/dev/null); do
            rel="${d%/}"
            # Never touch the release actually being served.
            [ "$(readlink -f "$rel")" = "$current" ] && continue
            n=$((n + 1))
            if [ "$n" -le 5 ]; then
              continue
            elif [ "$n" -le 30 ]; then
              find "$rel" -mindepth 1 -maxdepth 1 ! -name build \
                -exec rm -rf -- {} + 2>/dev/null || true
              if [ -d "$rel/build" ]; then
                find "$rel/build" -mindepth 1 -maxdepth 1 ! -name client \
                  -exec rm -rf -- {} + 2>/dev/null || true
              fi
            else
              rm -rf -- "$rel"
            fi
          done
          true
